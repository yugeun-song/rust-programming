# Study plan for this repository. Everything the build reads lives in Cargo.toml,
# .cargo/config.toml and rust-toolchain.toml; this file records the topic roadmap
# and the layout rules that are easy to forget.

[layout]
topic = "<topic>/src/bin/<name>.rs, discovered by cargo; the crate is listed in members"
unique_names = "binary names must be unique across topics; all targets share target/debug/"
central_config = "profiles and codegen flags live at the root; a member [profile] is ignored"

[taxonomy]
# Planned topics in study order. `group` is the second level; the directory
# layout stays flat, one crate per topic, several programs per crate. Names are
# the words TRPL, rust-by-example and std use. Topics are created on demand, so
# most of this list is not on disk yet.
topics = [
  { group = "basics", name = "format",       purpose = "println! and std::fmt: Display, Debug, width, precision, padding." },
  { group = "basics", name = "variable",     purpose = "let, mut, shadowing, scope, deferred initialization." },
  { group = "basics", name = "primitive",    purpose = "Integers, floats, bool, char, tuple, array; overflow and checked math." },
  { group = "basics", name = "constant",     purpose = "const and static, const fn, const generics, compile-time evaluation." },
  { group = "basics", name = "expression",   purpose = "Statements versus expressions, blocks as values, the never type." },
  { group = "basics", name = "control_flow", purpose = "if, loop, while, for, labels, if let, let else, while let." },
  { group = "basics", name = "functions",    purpose = "Parameters, return values, diverging functions, function pointers." },

  { group = "memory_model", name = "ownership",     purpose = "Move semantics, Copy versus Clone, partial moves, RAII." },
  { group = "memory_model", name = "borrow",        purpose = "Shared and mutable references, aliasing, reborrowing, the borrow checker." },
  { group = "memory_model", name = "slice",         purpose = "Borrowed views: &[T], &str, ranges, split, chunks." },
  { group = "memory_model", name = "lifetime",      purpose = "Lifetime parameters, elision, 'static, bounds, coercion." },
  { group = "memory_model", name = "drop",          purpose = "Drop, drop order, ManuallyDrop, mem::take/replace/forget, leaking." },
  { group = "memory_model", name = "layout",        purpose = "Stack versus heap, size and alignment, repr, padding, size_of." },
  { group = "memory_model", name = "smart_pointer", purpose = "Box, Rc, Arc, Deref, Cell, RefCell, reference cycles." },

  { group = "abstraction", name = "struct",            purpose = "Named, tuple and unit structs; methods and associated functions." },
  { group = "abstraction", name = "enum",              purpose = "Variants, payloads, discriminants, enum-driven modeling." },
  { group = "abstraction", name = "pattern",           purpose = "match, destructuring, guards, @ bindings, refutability." },
  { group = "abstraction", name = "generic",           purpose = "Generic parameters, bounds, where clauses, monomorphization." },
  { group = "abstraction", name = "trait",             purpose = "Impls, default methods, associated types, supertraits, blanket impls." },
  { group = "abstraction", name = "dispatch",          purpose = "impl Trait versus dyn Trait, vtables, dyn compatibility." },
  { group = "abstraction", name = "derive",            purpose = "#[derive] and the derivable std traits." },
  { group = "abstraction", name = "operator_overload", purpose = "std::ops and std::cmp, the newtype idiom." },
  { group = "abstraction", name = "conversion",        purpose = "From/Into, TryFrom, AsRef, Borrow, Cow, as casts, coercions." },

  { group = "std_types", name = "collection", purpose = "Vec, VecDeque, HashMap, BTreeMap, HashSet; the entry API." },
  { group = "std_types", name = "string",     purpose = "String versus str, UTF-8, chars versus bytes, slicing pitfalls." },
  { group = "std_types", name = "closure",    purpose = "Capture modes, Fn/FnMut/FnOnce, move closures, returning closures." },
  { group = "std_types", name = "iterator",   purpose = "Iterator, adapters, laziness, collect, IntoIterator, custom iterators." },
  { group = "std_types", name = "time",       purpose = "Duration, Instant, SystemTime, measuring elapsed time." },

  { group = "error_handling", name = "panic", purpose = "panic!, unwinding versus abort, assertions, catch_unwind." },
  { group = "error_handling", name = "error", purpose = "Option and Result, ?, the Error trait, source chains, custom errors." },

  { group = "project", name = "module",        purpose = "Modules, visibility, paths, use, re-exports, splitting a crate." },
  { group = "project", name = "package",       purpose = "Package versus crate versus module, targets, features, workspaces." },
  { group = "project", name = "attribute",     purpose = "Attributes, cfg and conditional compilation, lint attributes." },
  { group = "project", name = "documentation", purpose = "/// and //! comments, rustdoc, intra-doc links, doc tests." },
  { group = "project", name = "testing",       purpose = "Unit and integration tests, should_panic, cargo test filtering." },

  { group = "concurrency", name = "thread",  purpose = "spawn and join, scoped threads, thread-local state, panics across threads." },
  { group = "concurrency", name = "channel", purpose = "mpsc channels, message passing, moving ownership between threads." },
  { group = "concurrency", name = "sync",    purpose = "Mutex, RwLock, Arc, Condvar, atomics, poisoning, deadlock." },
  { group = "concurrency", name = "marker",  purpose = "Send, Sync, Sized and ?Sized, PhantomData, auto traits." },
  { group = "concurrency", name = "async",   purpose = "Futures, async and await, Pin, executors and tasks, streams." },

  { group = "metaprogramming", name = "macro_rules", purpose = "Declarative macros: designators, repetition, hygiene." },
  { group = "metaprogramming", name = "proc_macro",  purpose = "Derive, attribute and function-like macros; TokenStream." },

  { group = "systems", name = "io",      purpose = "Read, Write, BufRead; stdin, stdout, stderr; buffering." },
  { group = "systems", name = "fs",      purpose = "Files, Path and PathBuf, traversal, metadata, permissions." },
  { group = "systems", name = "env",     purpose = "Arguments, environment variables, current directory, exit codes." },
  { group = "systems", name = "process", purpose = "Spawning child processes, pipes, exit status." },
  { group = "systems", name = "net",     purpose = "TcpListener, TcpStream, UdpSocket, addresses, a minimal server." },

  { group = "unsafe_ffi", name = "unsafe", purpose = "unsafe blocks and functions, raw pointers, unions, safety invariants." },
  { group = "unsafe_ffi", name = "ffi",    purpose = "extern blocks, the C ABI, repr(C), CStr and CString, linking." },

  { group = "performance", name = "debugging", purpose = "rust-gdb and rust-lldb, pretty-printers, strace, valgrind." },
  { group = "performance", name = "benchmark", purpose = "Instant, black_box, opt-level effects, reading perf output." },
]
