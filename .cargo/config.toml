# Codegen flags for every build, debug and release alike.
#   force-frame-pointers  rbp-based frames, so gdb, perf and valgrind unwind reliably
#   link-dead-code        keeps functions written but never called. Effective in
#                         debug; in release, lto = "thin" drops them at the IR
#                         level, before the linker sees a section to keep
#   relocation-model      non-PIE, so objdump addresses match runtime addresses
#   dwarf-version         DWARF 5, the richest debug format the installed tools read
[build]
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "link-dead-code",
    "-C", "relocation-model=static",
    "-C", "dwarf-version=5",
]
