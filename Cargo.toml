[workspace]
resolver = "3"

# One member per topic, kept sorted by ./scaffold. Programs inside a topic are
# found by Cargo through the src/bin convention and need no entry here.
members = ["format", "functions", "variable"]

[workspace.package]
edition = "2024"

# Debug build: nothing optimized away or reordered, except that inline(always)
# is still folded in at opt-level 0. A single codegen unit with incremental
# compilation off keeps symbol names and disassembly stable across rebuilds.
# Codegen flags live in .cargo/config.toml.
[profile.dev]
debug = "full"
incremental = false
codegen-units = 1

# Release build: the tuning production Rust binaries normally ship with, except
# that debug info and symbols are kept so perf and gdb still work on it.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "full"
strip = "none"
